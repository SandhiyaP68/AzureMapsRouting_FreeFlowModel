<!doctype html>
<html lang="en">
  <head>
    <title>Signup</title>
  </head>
  <body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f2f2f2; font-family: Arial, sans-serif;">
    <div style="width: 278px; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);">
        <img src="https://hrms.gain-hub.com/web/static/img/odoo_logo_tiny.png" alt="Logo Placeholder" style="width: 302px; height: 79px; padding: 0px;">
      <h2 style="text-align: center; color: #333;">Sign Up</h2>
      <form method="post" action="{{ url_for('signup') }}">
        <input type="text" name="username" placeholder="Username" required
               style="width: 92%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
        <input type="password" name="password" placeholder="Password" required
               style="width: 92%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
        <button type="submit"
                style="width: 100%; padding: 10px; background-color: #ff9900; color: white; border: none; border-radius: 4px; cursor: pointer;">
          Sign Up
        </button>
      </form>
      <div style="text-align: center; margin-top: 10px;">
        <p>Already have an account?</p><a href="{{ url_for('login') }}" style="color: #0051ff; text-decoration: none;">Log in</a>
      </div>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul style="color: red; padding-left: 0; list-style-type: none; margin-top: 10px;">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
    </div>
  </body>
</html>
